[package]
name = "kirra-world-service"
version = "0.1.0"
edition = "2021"
description = "Kirra World service adapter — PROTOTYPE crate graph only, no service (ADR-0040 WM-1)"
publish = false

# Depends on the domain core and the storage adapter. No HTTP, no runtime, no
# transport: adding one here is what Fence A exists to prevent, and the gate
# checks this crate's closure for actuation and authorization edges.
[dependencies]
kirra-world = { path = "../kirra-world" }
kirra-world-store = { path = "../kirra-world-store" }

# `test-support` unlocks the store's raw-SQL escape hatch, which is the only
# way to plant a corrupt chain digest -- the write path refuses to produce one,
# which is why the refusal below has to be provoked rather than seeded.
[dev-dependencies]
kirra-world-store = { path = "../kirra-world-store", features = ["test-support"] }
