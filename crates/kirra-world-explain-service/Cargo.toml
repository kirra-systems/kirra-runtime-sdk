# crates/kirra-world-explain-service/Cargo.toml
#
# Tier 4 box 4c — the World-side PRODUCER process for explanation artifacts.
#
# ONE JOB, and the name says which: expose bounded, presentation-safe
# `ExplanationArtifact` responses. Deliberately NOT a container name like
# `kirra-world-sidecars` — a container name creates gravitational pull, and once
# it exists every World-adjacent daemon wants to move in until the crate's
# authority is whatever accumulated there. A name that states its one job is
# easier to fence, and the second World-facing service should have to justify
# its own crate rather than inherit this one's clearances.
#
# THE `kirra-world-` PREFIX IS LOAD-BEARING, not decoration: `is_world_package`
# in ci/check_kirra_world_bidirectional_fence.py is name-prefixed, so this crate
# falls under Fence A by CONSTRUCTION rather than by anyone remembering to
# register it. Renaming it out of the namespace would silently remove the fence.
#
# May depend on:  kirra-world-service, kirra-explain-types, HTTP/serde/runtime
# May NOT depend on: kirra-mick (or any Mick-side crate), ROS/DDS/serial/CAN/GPIO,
#                    checker/governor/release-token types.
[package]
name = "kirra-world-explain-service"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Bounded, presentation-only explanation responses from Kirra World. Serves one operation: explain the current answer about a named subject."
repository = "https://github.com/kirra-systems/kirra-runtime-sdk"
license-file = "../../COPYRIGHT"
publish = false  # proprietary (see COPYRIGHT) — not for crates.io

[dependencies]
# ONE dependency, and that is the ruling working.
#
# This crate owns the PROCESS BOUNDARY, not the explanation semantics, so it has
# no business reading the store, holding the presentation types, or encoding
# anything until it actually serves a route. `kirra-world-store`,
# `kirra-explain-types`, `serde` and `serde_json` were all here while the labels
# and the core lived in this crate; they left with them, and review caught that
# the manifest had not caught up with a comment already claiming they had.
#
# Box 3b re-added exactly what the transport needs and no more:
#
#   kirra-world-service  the explanation SEMANTICS, behind the typed boundary.
#   kirra-world-store    the CONSTRUCTOR only. This crate calls `WorldStore::open`
#                        and passes the reference along; every read that returns
#                        domain content happens on the far side of
#                        `explain_current_subject`. `open` is classified
#                        `operational` in ci/store_boundedness_baseline.json, and
#                        rule 5 of ci/check_query_boundedness.py is what keeps a
#                        domain read from appearing here later.
#   kirra-explain-types  the neutral wire contract, shared with Mick.
#   serde_json           the codec. No serde derive: this crate defines no wire
#                        type of its own, which is the property that keeps the
#                        contract single-sourced in the guarded crate.
#
# Still ABSENT, and deliberately: any HTTP framework, any async runtime, and
# `kirra-sidecars` — see the note in src/http.rs on why the plumbing is copied
# rather than shared.
kirra-world-service = { path = "../kirra-world-service" }
kirra-world-store = { path = "../kirra-world-store" }
kirra-explain-types = { path = "../kirra-explain-types" }
serde_json = "1"
