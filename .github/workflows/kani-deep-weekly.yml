# EP-15 follow-up — the weekly DEEP Kani lane. The per-PR `kani-proofs` job in
# ci.yml runs the default harness set (fast, BLOCKING). Harnesses behind the
# `deep-proofs` feature of `verification/kani` run here instead:
#
#   * K3 (#1243) — SG1, the P2 speed ceiling. THIS ONE IS AN ASSURANCE CHANGE,
#     not lane management: SG1 no longer has a per-PR symbolic proof. #1243
#     made the true property relational (the return is the TIGHTER of the
#     ceiling and the rate bound), and every true formulation measured failed
#     to converge at 15 min where the old — now false — form took 22 s. The
#     property was deliberately not weakened to regain runtime. Per-PR gate:
#     the two-part concrete mirror covering both arms of the disjunction.
#   * R2 — closing-speed monotonicity of `longitudinal_safe_distance` on the
#     full integer-scaled parameter lattice. Its exact-IEEE relational instance
#     blew the per-PR 45-minute job budget on BOTH default CaDiCaL and kissat;
#     the final UNSAT solve alone ran 43+ minutes without returning (PR #888).
#   * K8 (#1243) — the accel/brake rate bound over every executable return, in
#     VELOCITY space. Its acceleration-space form failed in 186 s on a denormal
#     counterexample (a step smaller than one ulp of `current`, divided by a
#     subnormal dt); restated in the space the kernel actually computes in, it
#     produced no verdict at 25 min or at 55 min. Per-PR gate: the 2,880-point
#     physical-dt grid, which asserts the ACCELERATION form this proof had to
#     abandon, so the two tiers are complementary rather than duplicative.
#   * K7 (#1242) — P-RACK, every executable return of the kinematics kernel
#     respects the absolute steering limit. Under the #1242 transcendental
#     model its sibling harnesses discharge in 22–45 SECONDS; K7 alone was
#     stopped at 23 minutes of CBMC time with no verdict. It is the only one
#     needing axiom A3, the constraint coupling the `atan` answer to the `tan`
#     question. Note the difference from R2 and do not flatten it: R2 was
#     measured to exceed a budget, K7 has no measured budget at all, so if this
#     lane does not converge either, the right response is to demote K7 out of
#     the proof tier rather than leave a harness that never finishes. The same
#     applies to K8.
#
# A PATTERN worth knowing before adding a harness, measured under one solver
# model and one symbolic contract: an assertion comparing a returned value
# against a CONTRACT FIELD discharges in tens of seconds (K3 22 s, K6 45 s);
# an assertion that is RELATIONAL ARITHMETIC over two command fields does not
# finish (K7, K8). Expect the second shape to land in this lane.
#
# This lane gives the solver the same scheduled multi-hour budget the EP-22
# deep-fuzz campaign uses. Every deep property keeps a BLOCKING per-PR concrete
# mirror in the kani crate's `cargo test` — for R2 the full speed-grid walk
# swept along all four parameter axes, for K7 the 306,180-point exhaustive grid
# over the executable return, for K8 the 2,880-point physical-dt grid — so
# demotion here never leaves a property with zero per-PR coverage. Kept in its OWN workflow so the `schedule` trigger does
# not fan the whole ci.yml job graph out weekly.
name: Kani deep proofs (weekly)

on:
  schedule:
    # 04:37 UTC Sunday (off the hour to dodge the top-of-hour scheduler surge;
    # offset from the deep-fuzz campaign's 03:23 slot).
    - cron: "37 4 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kani-deep-weekly
  cancel-in-progress: true

jobs:
  kani-deep:
    name: Kani deep proofs (deep-proofs feature, multi-hour solver budget)
    runs-on: ubuntu-latest
    # The whole point of this lane is budget: the R2 UNSAT solve is known to
    # exceed 45 min and its true cost is unmeasured — give it the full window.
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Kani
        # No install-flake tolerance here (unlike the per-PR lane): this lane
        # exists ONLY to run the proofs, so a skipped run must read as red.
        run: cargo install kani-verifier --locked && cargo kani setup
      - name: Run ALL Kani proofs with deep harnesses enabled (BLOCKING)
        # `--features deep-proofs` compiles the deep harnesses IN ADDITION to
        # the default set (re-running the fast set costs minutes against an
        # 8 h budget and means a new deep harness joins this campaign with no
        # workflow edit — the no-silent-caps rule).
        run: cd verification/kani && cargo kani --features deep-proofs
