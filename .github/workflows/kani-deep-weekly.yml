# EP-15 follow-up — the weekly DEEP Kani lane. The per-PR `kani-proofs` job in
# ci.yml runs the default harness set (fast, BLOCKING). Harnesses behind the
# `deep-proofs` feature of `verification/kani` run here instead:
#
#   * K3 (#1243) — SG1, the P2 speed ceiling. THIS ONE IS AN ASSURANCE CHANGE,
#     not lane management: SG1 no longer has a per-PR symbolic proof. #1243
#     made the true property relational (the return is the TIGHTER of the
#     ceiling and the rate bound), and every true formulation measured failed
#     to converge at 15 min where the old — now false — form took 22 s. The
#     property was deliberately not weakened to regain runtime. Per-PR gate:
#     the two-part concrete mirror covering both arms of the disjunction.
#   * R2 — closing-speed monotonicity of `longitudinal_safe_distance` on the
#     full integer-scaled parameter lattice. Its exact-IEEE relational instance
#     blew the per-PR 45-minute job budget on BOTH default CaDiCaL and kissat;
#     the final UNSAT solve alone ran 43+ minutes without returning (PR #888).
#   * K8 (#1243) — the accel/brake rate bound. 🔴 NO LONGER IN THIS LANE.
#     Demoted OUT of the proof tier by #1260, on the same phase diagnosis and
#     the same rule as K7, and now behind `outside-proof-envelope`. Measured:
#     the full harness runs symex in 0.34 s, converts in 1.43 s, completes
#     THREE solves totalling 101 s, then enters a fourth propositional
#     conversion that never reaches a solver — 43 of 45 minutes go there.
#     Isolated to its ONE real assertion (373 of 374 properties dropped) the
#     CNF shrinks only 0.54% (848,226 -> 843,634), conversion completes in
#     1.0 s, the solver IS reached, and it returns nothing in 40 minutes. Two
#     failures at once; fixing the conversion stall only exposes the hard
#     instance. Per-PR gate unchanged: the 2,880-point physical-dt grid, which
#     asserts the ACCELERATION form the proof had to abandon — so the grid is
#     not a weaker copy of the proof and no coverage was lost.
#   * K7 (#1242) — P-RACK. 🔴 NO LONGER IN THIS LANE. It was demoted OUT of the
#     proof tier by #1268 and now sits behind `outside-proof-envelope`, a
#     feature no lane enables. The previous text here said its demotion was
#     provisional and a multi-hour budget might suffice; that was TESTED AND
#     REFUTED. Isolating K7's two real assertions — discarding 368 of its 370
#     properties — shrank the CNF by 0.5% (738,811 → 735,393 clauses), so the
#     property set is not the cost, and in that configuration CBMC reaches the
#     solver and still returns nothing at 30 min. K7 stalls in propositional
#     conversion in multi-property mode AND is solver-hard when isolated;
#     fixing the first only exposes the second. ~735k clauses for an 8.8k-step
#     program expression is IEEE-754 bit-blasting of two separately encoded f64
#     chains. Do not re-add it here expecting a bigger runner to finish it.
#     P-RACK stays enforced per-PR by its 306,180-point grid, so no coverage
#     was lost — only the symbolic tier.
#
# A PATTERN worth knowing before adding a harness, measured under one solver
# model and one symbolic contract: an assertion comparing a returned value
# against a CONTRACT FIELD discharges in tens of seconds (K3 22 s, K6 45 s);
# an assertion that is RELATIONAL ARITHMETIC over two command fields does not
# finish (K7, K8). Expect the second shape to land in this lane.
#
# ⚠️ HISTORY, because the numbers above were written against a lane that did
# not work (#1260). Between 12 July and 31 July 2026 this lane completed FOUR
# runs' worth of wall-clock and produced ZERO verdicts. Every run was killed at
# the GitHub-hosted SIX-HOUR per-job ceiling and reported `cancelled` — grey,
# not red — so nothing surfaced it. Two distinct causes, both now fixed here:
#
#   * `timeout-minutes: 480` was INERT. A hosted job cannot exceed 360 minutes;
#     declaring more does not buy more, it just means the PLATFORM decides the
#     outcome, and the platform's word for "out of time" is `cancelled`.
#   * ONE JOB, HARNESSES IN SERIES. The first non-terminating harness consumed
#     everything behind it. On 2026-07-26 R2 spent 5 h 59 m inside a single
#     kissat solve; on run 30629178939 K7 hung in CBMC's propositional
#     reduction 17 s in and K3, K8 and R2 were never even started. Which
#     property received any budget at all was decided by scheduling order.
#
# That run also split the two remaining unknowns apart, and the distinction is
# load-bearing for what to do next. R2's orphan process was `kissat` — it is
# solver-bound, a real budget question. K7's orphan was `cbmc` and no solver
# was ever invoked — it is ENCODER non-termination, so "give it more hours" may
# simply be the wrong diagnosis. K3 and K8 remain entirely unmeasured under a
# multi-hour budget; the matrix below is what will finally measure them.
#
# Every deep property keeps a BLOCKING per-PR concrete mirror in the kani
# crate's `cargo test` — for R2 the full speed-grid walk swept along all four
# parameter axes, for K8 the 2,880-point physical-dt grid, and for K7 (now
# demoted entirely) the 306,180-point exhaustive grid over the executable
# return, which is unaffected by that demotion and remains its enforcement.
# That rule is the only reason four weeks of a dead lane was a coverage
# REDUCTION and not a coverage HOLE, and it is why K7 could be dropped from the
# proof tier at zero cost to what is actually checked. Treat it as
# load-bearing, not as belt-and-braces.
#
# Kept in its OWN workflow so the `schedule` trigger does not fan the whole
# ci.yml job graph out weekly.
name: Kani deep proofs (weekly)

on:
  schedule:
    # 04:37 UTC Sunday (off the hour to dodge the top-of-hour scheduler surge;
    # offset from the deep-fuzz campaign's 03:23 slot).
    - cron: "37 4 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kani-deep-weekly
  cancel-in-progress: true

jobs:
  # The matrix is DERIVED from the source, never hand-maintained (#1260). The
  # single `cargo kani --features deep-proofs` this lane used to run had one
  # genuinely good property — a newly-demoted harness joined the campaign with
  # no workflow edit — and a hardcoded list would have silently thrown it away.
  # `ci/deep_harnesses.py` keeps it, and fails closed on an empty deep tier so
  # the lane can never pass while proving nothing.
  discover:
    name: Enumerate deep harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      harnesses: ${{ steps.list.outputs.harnesses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        run: |
          set -euo pipefail
          harnesses="$(python3 ci/deep_harnesses.py)"
          echo "deep harnesses: $harnesses"
          echo "harnesses=$harnesses" >> "$GITHUB_OUTPUT"

  kani-deep:
    name: "Kani deep proof: ${{ matrix.harness }}"
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One harness per job. Before #1260 every harness shared a single job, so
      # the first non-terminating one consumed the whole lane and everything
      # behind it got ZERO solver time — K7 starved K3/K8/R2 on run
      # 30629178939, and R2 starved everything on 2026-07-26. Which property
      # got any budget at all was decided by scheduling order.
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.discover.outputs.harnesses) }}
    # MUST stay below the GitHub-hosted 6 h (360 min) per-job ceiling, and that
    # is the entire point of the number. The old `timeout-minutes: 480` was
    # INERT: the platform killed the job at 360 min and reported `cancelled`,
    # which renders grey rather than red, so four consecutive runs produced no
    # verdict and nothing surfaced it. A timeout we own fires FIRST and fails
    # the job. Do not raise this to or above 360 — that hands the decision back
    # to the platform and restores the silent-grey failure.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Kani
        # No install-flake tolerance here (unlike the per-PR lane): this lane
        # exists ONLY to run the proofs, so a skipped run must read as red.
        run: cargo install kani-verifier --locked && cargo kani setup
      - name: "Prove ${{ matrix.harness }} (BLOCKING)"
        # Step timeout under the job timeout under the platform ceiling, so a
        # non-terminating harness surfaces as a FAILED step naming itself,
        # rather than a cancelled job naming nothing.
        timeout-minutes: 300
        run: |
          cd verification/kani
          cargo kani --features deep-proofs --harness '${{ matrix.harness }}'
