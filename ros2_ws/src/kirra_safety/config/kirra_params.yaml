cmd_vel_interceptor:
  ros__parameters:
    kirra_url: "http://localhost:8090"
    kirra_token: ""              # Set via environment variable KIRRA_ADMIN_TOKEN or launch arg
    kirra_client_id: "ros2-interceptor-01"
    wheelbase_m: 0.229             # Hiwonder ROSOrin wheelbase (meters)
    # #1219: the interceptor cross-checks this against the wheelbase the verifier
    # reports for its ACTIVE class contract; a mismatch >1e-6 latches a PERMANENT
    # stop (enforcement_decision.py `wheelbase_consistent`). So this value and
    # KIRRA_VEHICLE_CLASS are one decision, not two:
    #   • r2 class      → 0.229  (== the physical, MEASURED wheelbase)  ← current
    #   • courier class → 0.5
    # With KIRRA_VEHICLE_CLASS=courier this 0.229 would MISMATCH and latch the
    # stop, so the class flip is required for the live loop to run at all — not
    # only for the envelope to be right.
    max_speed_mps: 1.8           # ROSOrin spec max speed (m/s)
    input_topic: "/cmd_vel"
    output_topic: "/cmd_vel_safe"
    enforcement_topic: "/kirra/enforcement_action"
    posture_topic: "/kirra/fleet_posture"
    timeout_ms: 50               # Kirra API timeout (ms) -- fail-closed on timeout
    fallback_on_timeout: "stop"  # "stop" (fail-closed) or "passthrough" (degraded mode)
    use_perception_cap: false    # opt-in: apply Taj's assured-clear-distance cap before the governor
    perception_cap_topic: "/kirra/perception_speed_cap"
    perception_cap_stale_ms: 300 # cap older than this is a perception fault -> fail-closed stop
    release_topic: "/kirra/release"  # ADR-0033 relay: verifier-minted signed frames -> motor consumer

occy_doer:
  ros__parameters:
    # REQUIRED (the node refuses to start without it): newest-scan staleness
    # budget in seconds -- perception older than this and the doer HOLDS
    # instead of proposing motion. 0.25 s = 2.5 scan periods of the
    # bench-verified TG30 at ~10 Hz (HARDWARE_FINDINGS_R2X3.md deployment);
    # a different lidar rate needs a deployment-review update here.
    scan_stale_s: 0.25

    # Plan-cycle rate. The Taj + planner calls run in a background job, so a
    # tick publishes the PREVIOUS tick's result: perception is one tick period
    # plus one round trip old when it is used. At the node default of 5 Hz that
    # is 200 ms + up to 120 ms of HTTP against a 250 ms budget, so plans would
    # age out and the doer would hold intermittently on a healthy lidar. 10 Hz
    # (100 ms) matches the bench-verified TG30 scan rate and leaves the
    # staleness budget intact. The node WARNs at startup if this no longer
    # fits. Raising it above the lidar rate costs nothing: a job is issued only
    # when a new scan has arrived.
    plan_hz: 10.0

    # --- frame-health detectors (OPT-IN; default off) --------------------
    # scan_stale_s above measures ARRIVAL. It cannot distinguish a live lidar
    # from a driver that has wedged and is republishing its last buffer at the
    # full rate — that stream is "fresh" by every arrival-time check while the
    # doer plans against a frozen world. These detectors track frame IDENTITY
    # progression (producer header stamp) instead. See sensor_freshness.py.
    #
    # Leave false until the deployment lidar's stamp behaviour is confirmed
    # sane on the bench: a driver that never populates header.stamp would trip
    # STAMP_NOT_ADVANCING immediately and hold the robot.
    frame_health_enabled: false
    # Consecutive non-advancing scans tolerated before holding. 3 at ~10 Hz is
    # ~300 ms — rides out a single duplicated frame, far short of a stall.
    frame_stall_budget: 3
    # Both sentinel-disabled: 0.0 Hz and ratio 1.0 never fire. Arm only with a
    # measured floor for the deployed lidar, not a guessed one.
    scan_min_rate_hz: 0.0
    scan_max_invalid_ray_ratio: 1.0

    # Mick typed-intent sidecar (kirra-sidecars mick_service). Empty = off
    # (goals come from /goal_pose only). Set here so occy_doer polls GET
    # /intent/last each tick and grounds NEW positional intents as its goal —
    # the R2 voice/LLM goal path. Mick publishes INTENTS, never commands.
    mick_url: "http://127.0.0.1:8102"

    # --- R2-SIZED footprint + clearance (doer-side; sent to the planner's
    # CHECKER each tick). WITHOUT these the node falls back to occy_doer.py's
    # courier-sized defaults (half 0.15/0.18, clearance 0.6/0.6) and judges a
    # ~0.2 m robot as if it needed a courier's lane -> the corridor pinches
    # shut and KIRRA MRCs even passable gaps. Setting the robot's REAL size is
    # accurate modelling, NOT a safety relaxation.
    #
    # NOTE the two distinct "space" surfaces (docs/CONTRACT_PROFILES.md):
    #   * footprint (half_*): the robot's BODY. Keep it >= the real robot.
    #     NEVER shrink below reality.
    #   * clearance TARGETS (lateral_clearance_target_m /
    #     rss_lateral_alignment_tolerance_m): extra room DEMANDED beyond the
    #     body. A 0.2 m robot honestly needs far less than an AV's 0.6 m.
    # This is the doer dry-run envelope only; the ACTUATION envelope (Stage 2)
    # is the verifier's per-class contract (courier interim until a measured
    # `r2` class lands -- see robot/install/PLATFORM_R2_PENDING.md).
    #
    # PROVENANCE: footprint MEASURED (body 13 in x 8 in = 0.330 x 0.203 m ->
    # half 0.165 x 0.102, +small margin); steering MEASURED (full lock ~39 deg
    # / 0.68 rad @ cmd +/-45, r2_drive_calibration_results.txt Phase C
    # 2026-07-17); wheelbase MEASURED ~0.229 m (front-to-rear CONFIRM still
    # owed). Origin-offset / overhangs unmeasured -> the corridor_back
    # extension (0.5 m) covers the rear; half_length assumes a roughly-front
    # origin (lidar at base). Firm both up per PLATFORM_R2_PENDING.
    # #1219: r2, not the courier interim. `VehicleConfig::for_class` knows "r2",
    # and courier is a MORE PERMISSIVE envelope for this platform (2x assumed
    # braking, 2.5x speed ceiling). The explicit numbers below still win for the
    # fields they name; this selects the band for the fields they do not.
    vehicle_class: "r2"                         # doer RSS-band label; numbers below win
    wheelbase_m: 0.229                          # MEASURED ~9 in (front-to-rear CONFIRM pending)
    half_length_m: 0.17                         # MEASURED body 13 in=0.330 m -> half 0.165 + margin
    half_width_m: 0.11                          # MEASURED body 8 in=0.203 m -> half 0.102 + margin
    max_steering_deg: 39.0                      # MEASURED full lock ~39 deg (0.68 rad) @ cmd +/-45 (calib Phase C)
    lateral_clearance_target_m: 0.15            # robot-scale (was courier 0.6)
    rss_lateral_alignment_tolerance_m: 0.15     # robot-scale (was courier 0.6)

perception_governor:
  ros__parameters:
    taj_url: "http://localhost:8101"   # the Taj perception sidecar (kirra-mick example taj_service)
    scan_topic: "/scan"
    cap_topic: "/kirra/perception_speed_cap"
    health_topic: "/kirra/perception_health"
    timeout_ms: 40               # PER-SOCKET-OPERATION budget; see deadline_ms
    # #1218 non-blocking cycle. deadline_ms is NOT a second timeout: `requests`
    # times out per socket operation, so a sidecar dribbling bytes never trips
    # timeout_ms. This is the wall-clock budget the NODE enforces, after which
    # the cap is floored regardless of what the transport is doing.
    publish_period_ms: 100       # how often the cap is (re)decided and published
    deadline_ms: 250             # in-flight budget before the cap is floored
    scan_stale_ms: 500           # max age of the SCAN behind a published cap
    forward_extent_m: 8.0        # Taj geometric horizon (m)
    decel_mps2: 1.5              # assumed comfortable brake for the ACD cap
    margin_m: 0.4                # standoff distance (matches the checker's lateral margin)
    lane_half_m: 0.26            # scalar forward-object lane gate
    vehicle_width_m: 0.203       # measured R2 body width
    lateral_clearance_m: 0.15    # required clearance on each side
    confidence_floor: 0.5        # below this -> unhealthy -> 0.0 cap
    # #1212: cap_rise_rate_mps_per_s / cap_restriction_epsilon_mps /
    # cap_clear_confirmations / cap_maximum_dt_ms are deliberately ABSENT. The
    # stabilizer they configure moved into the Rust checker
    # (kirra_trajectory::cap_stabilizer), which is the safety authority. rclpy
    # silently ignores an override for an undeclared parameter, so leaving them here
    # would be tuning that appears to apply and does nothing. Tune the checker.

sensor_monitor:
  ros__parameters:
    kirra_url: "http://localhost:8090"
    kirra_token: ""
    kirra_client_id: "ros2-sensor-monitor-01"
    report_interval_ms: 200      # How often to post health reports (ms)
    lidar_min_hz: 5.0            # Minimum acceptable LiDAR rate (Hz)
    imu_covariance_threshold: 0.1
    odometry_stale_ms: 500       # Odometry stale threshold (ms)

posture_subscriber:
  ros__parameters:
    kirra_url: "http://localhost:8090"
    kirra_token: ""
    kirra_client_id: "ros2-posture-bridge-01"
    cmd_vel_safe_topic: "/cmd_vel_safe"
