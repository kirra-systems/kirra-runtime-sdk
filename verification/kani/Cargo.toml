# EP-15 — Kani proof harnesses over the checker cores.
#
# Kani (model-checking Rust via CBMC) PROVES a property for ALL inputs — not the
# samples a proptest happens to draw. The harnesses here machine-check invariants
# on the actuation-path checker cores:
#
#   * `src/lease.rs`            — HA lease algebra (split-brain non-overlap), all u64
#   * `kirra-core kinematics_contract` — fail-closed NaN/dt guards, the P2 speed
#                                 ceiling, the Degraded decel-to-stop denials
#   * `parko-core rss.rs`       — longitudinal-safe-distance totality + the
#                                 monotonicity `occlusion_limited_speed`'s bisection
#                                 RELIES on, over integer-scaled input grids
#
# FIDELITY: the sources under proof are `#[path]`-included VERBATIM from their
# shipped locations (the kinematics contract is the FROZEN talisman, git blob
# 851f3f44… — it must not be edited, so its proofs live here, not inline).
# `cargo test` in this crate compiles those same files and runs BOTH their own
# unit tests AND concrete mirror tests of every proof property, so the harness
# logic is validated even on machines without Kani.
#
# RUN:   cargo kani                      (inside verification/kani/)
#        cargo kani --harness <name>     (one property)
#        cargo kani --features deep-proofs   (adds the R2/K7/K8 deep harnesses)
# CI:    the `kani-proofs` lane (BLOCKING since the L5 flip) installs Kani and
#        runs the default set on every PR. Harnesses behind `deep-proofs` run
#        in the WEEKLY `kani-deep-weekly` lane instead — see the `deep-proofs`
#        feature block below for who is there and why. Every deep property
#        keeps a BLOCKING per-PR concrete mirror in this crate's `cargo test`.
#
# The empty `[workspace]` table detaches this crate from the parent workspace
# (like `fuzz/` and `crates/kirra-loom-models`): Kani never enters the root
# Cargo.lock, the MSRV lane, or a normal `cargo build --workspace`.
[package]
name = "kirra-kani-proofs"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

# `-Z stubbing` is required by the #1242 transcendental model (the `tan`/`atan`
# and `powi` stubs in `proofs_kinematics.rs`). Declaring it here rather than on
# the command line means every invocation gets it — `cargo kani`, the per-PR
# lane, and the weekly deep lane alike — so a proof cannot silently fall back
# to the unmodelled foreign calls because a flag was forgotten.
[package.metadata.kani]
unstable = { stubbing = true }

[features]
# Proof harnesses whose solver cost exceeds the per-PR CI budget. Compiled (and
# run) only by the weekly `kani-deep-weekly` lane via
# `cargo kani --features deep-proofs`. Gating is opt-IN per harness: a new
# harness is per-PR-blocking by default unless it is explicitly demoted here,
# so the deep lane can never silently absorb the whole proof set.
#
# Members: R2 (RSS full-lattice monotonicity) and K3 (SG1). K7 and K8 WERE
# members and are no longer — both demoted out of the proof tier on phase
# diagnoses; see the `outside-proof-envelope` feature below.
#
# K3 is here because it EARNED its place, not because it is slow: it discharges
# in 67 m 13 s (`0 of 310 failed`), which exceeds the 45-min per-PR budget but
# is a genuine weekly proof. It was briefly demoted on a 15-minute non-result
# and that inference was wrong — the standing lesson is that a timeout is a
# lower bound on cost, never evidence of intractability.
#
# K3 IS NOT ROUTINE LANE MANAGEMENT. It is an ASSURANCE CHANGE: SG1 lost its
# per-PR symbolic proof because #1243 made the true property relational, and
# every true formulation measured (conditional, disjunctive) failed to
# converge at 15 min where the old — now FALSE — form took 22 s. The property
# was deliberately NOT weakened to regain runtime. Anything summarising this
# lane must say SG1 is affected rather than folding K3 in with the others. They are NOT in the same evidential position and the
# difference should not be flattened: R2 was measured to exceed the budget and
# is expected to close with more time, whereas K7 (stopped at 23 min) and K8
# (stopped at 25 min and again at 55 min) have produced NO verdict under any
# budget tried, so it is not known that any suffices. All three keep a BLOCKING
# per-PR concrete mirror — K7's is the 306,180-point grid, K8's the 2,880-point
# physical-dt grid.
#
# The pattern predicting membership, measured under one solver model and one
# symbolic contract: a harness whose assertion compares a returned value against
# a CONTRACT FIELD discharges in tens of seconds (K3 22 s, K6 45 s); one whose
# assertion is RELATIONAL ARITHMETIC over two command fields does not finish
# (K7, K8). Worth knowing before writing the next one.
deep-proofs = []

# 🔴 NOT A LANE. Harnesses whose formulation is outside the practical proof
# envelope of the present toolchain (#1268). NO CI job enables this feature —
# not the per-PR `kani-proofs` lane, not the weekly `kani-deep-weekly` lane.
# `ci/deep_harnesses.py` matches only `deep-proofs`, so nothing here can reach
# the weekly matrix, and `ci/test_deep_harnesses.py` pins that.
#
# Members: K7 (P-RACK) and K8 (the rate bound). Both were diagnosed by the same
# two-part experiment and fail the same two ways: the full harness stalls in
# CBMC's propositional conversion without reaching a solver, and when isolated
# to its real assertion(s) the harness converts fine but the SOLVER returns
# nothing. Dropping ~99.5% of the properties moves the CNF by under 1% in both
# (K7 738,811 -> 735,393; K8 848,226 -> 843,634), so the pointer-dereference
# checks are not the cost — the program encoding is.
#
# R2 is deliberately NOT here, and the distinction is a PHASE fact, not a size
# fact. It never stalls in conversion: it reaches the solver and stays there.
#
# Note the sizes point OPPOSITE ways and only one of them is the solver's
# problem. R2's pre-solver metrics are far smaller (2,227 program-expression
# steps and 74 VCCs, against ~8,900 and ~400), but its CNF is LARGER —
# 1,221,711 clauses over 251,960 variables, against K7's 738,811 and K8's
# 848,226. So "R2 is the small one" is wrong about the thing the solver
# actually consumes, and must not be used as an argument for keeping it.
#
# What keeps it here is measured solver behaviour, and it is MIXED. With
# kissat's own telemetry captured (CBMC's --verbosity does not reach an
# external solver), across a full 43-minute solve:
#
#   0 -> 376 s     26,000 conflicts (70/s), "remaining" 97% -> 29%
#   376 -> 2604 s  94,659 conflicts (42/s), "remaining" 29% -> 26%
#   total          120,888 conflicts, no verdict
#
# The search NEVER STALLS — conflicts accumulate throughout and inprocessing
# stays active — but instance reduction DECELERATES sharply, nearly all of it
# landing in the first six minutes. R2 sits between "progressing" and
# "plateaued". That keeps it a budget/solver question rather than a modelling
# one; it does NOT show any particular budget suffices, and must not be
# summarised as "more time will finish it".
#
# Do not re-add either to `deep-proofs` on the theory that a
# larger runner or a longer timeout would finish it. That theory was tested and
# refuted: isolating K7's two real assertions (discarding 368 of 370 properties)
# shrank the CNF by 0.5% — 738,811 → 735,393 clauses — proving the property set
# is not the cost, and in that configuration CBMC reaches the solver and still
# returns nothing at 30 minutes. K7 stalls in propositional conversion in
# multi-property mode AND is solver-hard when isolated; fixing the first only
# exposes the second. ~735k clauses for an 8.8k-step program expression is
# IEEE-754 bit-blasting of two separately encoded f64 chains.
#
# Regaining a symbolic proof of P-RACK is a MODELLING redesign, not CI tuning,
# and it must preserve the actual safety claim rather than substitute an easier
# neighbouring property. Meanwhile P-RACK is enforced per-PR and BLOCKING by
# `k6_k7_mirror_exhaustive_grid_over_the_executable_return` (306,180 points), so
# this demotion costs no coverage — only the symbolic tier.
outside-proof-envelope = []

[lints.rust]
# `--cfg kani` is set by the cargo-kani driver, not by any Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
# The included kinematics-contract talisman derives serde on its wire types.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The included parko rss.rs test module uses proptest.
proptest = "1"

# Kani injects its own `kani` crate when driving the build; no dependency is
# declared for it, and every proof module is gated `#[cfg(kani)]` so normal
# builds compile none of it.
