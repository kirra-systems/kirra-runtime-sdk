# cargo-mutants configuration (WP-08 / MGA G-6 — mutation-testing gate).
#
# SCOPE. Mutation runs target the CHECKER crates (`-p kirra-trajectory`
# `-p kirra-core`, passed on the command line by the CI lane / the baseline
# scripts). #1196 added kirra-core: the SG2 containment check, the frozen
# kinematics-contract talisman and the Track-C perception guard live there and
# were outside the gate entirely. The CI lane enumerates WHICH kirra-core
# modules count as checker; see the `mutation-gate` job comment. The
# checker's slow-loop test battery now lives WITH the checker code
# (`crates/kirra-trajectory/tests/validation_tests.rs`, relocated from the
# adapter alongside the code it covers); the adapter crate is kept in scope
# because its conformance / perception-gate / cited-copy suites still exercise
# the checker through the Option-B re-export wiring, catching mutants the unit
# tests alone would not (measured 2026-07-07: 318 survivors own-tests-only vs
# 202 with the adapter suite; see docs/testing/MUTATION_BASELINE.md).
#
# `test_package` is the CORRECT mechanism for this. cargo-mutants defaults to
# running ONLY the mutated package's own tests; `test_package` (CLI
# `--test-package`) tells it which packages' test suites to run for every
# mutant. (An earlier config used `additional_cargo_test_args = ["--package",
# ...]` — that does NOT change which package's tests cargo-mutants runs, so
# the adapter suite never executed and adapter-killed mutants showed as
# survivors. `test_package` is the fix.)
#
# `kirra-core` must appear here as well as on the command line. cargo-mutants
# defaults to running the MUTATED package's own tests, but an explicit
# `test_package` REPLACES that default for every mutant — so without this entry
# a kirra-core mutant would be judged by the trajectory + adapter suites alone,
# its own containment/talisman tests would never execute, and it would report
# as a survivor. That is the same trap the `additional_cargo_test_args` note
# above describes, one crate over.
test_package = ["kirra-trajectory", "kirra-ros2-adapter", "kirra-core"]

# Generous per-mutant timeout: some mutations turn bounded loops degenerate;
# the suite itself runs in seconds, so 300 s cleanly separates "hung mutant"
# (caught as timeout) from slow CI I/O.
minimum_test_timeout = 300

# EQUIVALENT-MUTANT exclusions (EP-08 Frenet / curved-RSS geometry). Each entry
# below is a mutation that CANNOT be killed by any test because it does not
# change observable behaviour — cargo-mutants cannot detect equivalence, so it
# is excluded here with a written justification (mirrors the accept-with-reason
# policy in docs/testing/MUTATION_BASELINE.md §3/§6). These are precise
# function+operator patterns, NOT blanket operator excludes: the ONLY `<`/`-`
# operators remaining in `from_boundaries` after its redundant length guards
# were removed ARE the duplicate-collapse predicate, and the two RSS gates each
# have exactly one in-diff `<` (the EP-08 per-class overlap comparison).
exclude_re = [
    # Duplicate-midpoint collapse in the centerline builder: a defensive guard
    # whose only effect is to drop a zero-length centerline segment. Every
    # downstream traversal (project, tangent_at, total_heading_change_rad)
    # already skips a zero-length segment, so mutating the collapse predicate or
    # its coordinate subtraction produces byte-identical projections/tangents for
    # every corridor the resampler can produce — output-equivalent.
    "replace < with (==|<=|>) in CenterlineFrenet::from_boundaries",
    "replace - with (\\+|/) in CenterlineFrenet::from_boundaries",
    # Nearest-segment retention in `project`: `dist2 < best` vs `<=` differ only
    # when two segments are EXACTLY equidistant, where either choice yields the
    # same projected (s, d) — a measure-zero, output-equivalent boundary.
    "replace < with <= in CenterlineFrenet::project",
    # EP-08 per-class longitudinal-overlap gate (snapshot :553 + predictive
    # :911): `|dy| < overlap` vs `|dy| <= overlap` differ only at exact float
    # equality (|dy| == overlap to the bit) — a measure-zero boundary that is
    # behaviourally identical for any real perception input.
    "replace < with <= in validate_trajectory_slow_capped",
    "replace < with <= in predictive_rss_breach",
    # S1 (#1024) fast-loop lateral-acceleration bound: `lhs <= rhs` vs `lhs < rhs`
    # differ only when the command's lateral accel EXACTLY equals the envelope
    # ceiling (v²·|tan δ| == (max+tol)·L to the bit) — a measure-zero boundary,
    # behaviourally identical for any real command. Same class as the RSS gates
    # above. The bound was deliberately extracted into its own one-comparison
    # function so this exclusion is precise (the only `<=` there); the `*`/`+`
    # arithmetic and both `>` steering limits in `check_command_conforms` ARE
    # killed by the conformance tests.
    "replace <= with < in command_within_lateral_envelope",
    # S3 (#1037) longitudinal-RSS direction selector `obj_lon_v < 0.0` (snapshot
    # :657): `<` vs `<=` differ ONLY when the object's projected longitudinal velocity
    # is EXACTLY 0.0 (a relatively-stationary object). At that measure-zero boundary
    # the `<=` mutant routes the stopped object to the OPPOSITE-direction (head-on)
    # bound instead of the rear-end bound, which ADDS the oncoming's response-phase
    # creep — a STRICTLY MORE conservative required distance, never less safe. Same
    # measure-zero, safety-equivalent class as the RSS overlap gates above. The S3
    # change swapped the ego accel/brake ARGS (killed by the `posture_brake_symmetry`
    # tests), not this pre-existing selector.
    "replace < with <= in validate_trajectory_slow_with_envelope",
    # #1094 (F4) `ego_time_span` min/max scan: `if t < lo { lo = t }` vs
    # `if t <= lo { lo = t }` (and the `>`/`>=` max twin) are TRULY EQUIVALENT — not
    # just measure-zero. When `t == lo` the strict form skips (lo already == t) and
    # the non-strict form re-assigns (lo = t = the same value); the resulting min/max
    # is bit-identical for EVERY input, so no test can distinguish them. cargo-mutants
    # cannot prove equivalence, so they are excluded here (same accept-with-reason
    # policy as the boundary gates above). The scan's real behaviour — that it finds
    # the true min AND max, and that `in_ego_span` uses them — IS killed by the F4
    # per-window coverage test (a wrong span flips the in-span verdict).
    "replace < with <= in ego_time_span",
    "replace > with >= in ego_time_span",
    # C1 (#1192) straight-segment short circuit in `segment_sagitta_m`:
    # `theta < STRAIGHT_SEGMENT_HEADING_EPS_RAD` vs `<=` differ only at theta
    # EXACTLY 1e-9 — and at that theta both branches return exactly Some(0.0),
    # because `1 - cos(theta/2)` underflows to 0.0 in f64 well before 1e-9. The
    # threshold is a singularity guard (the closed form is 0/0 at theta = 0),
    # not a behavioural boundary, so no test can distinguish the two forms.
    # TRULY equivalent, like the ego_time_span pair above rather than merely
    # measure-zero. Pinned by `the_straight_short_circuit_agrees_with_the_arc_at_
    # the_epsilon`, which fails if the epsilon is ever raised into a range where
    # the arc IS representable — at which point this exclusion must be re-earned.
    "replace < with <= in segment_sagitta_m",
]
